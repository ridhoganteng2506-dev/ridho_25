<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Website Lamaran Kerja</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Bagian Formulir Lamaran -->
  <section id="lamaran" class="form-container">
    <h2>Formulir Lamaran</h2>
    <p class="subtitle">Isi data berikut untuk simulasi pendaftaran pekerjaan.</p>

    <form id="applicationForm">
      <!-- Nama Lengkap -->
      <div class="form-group">
        <label for="name">Nama Lengkap *</label>
        <input type="text" id="name" placeholder="Masukkan nama lengkap" required>
      </div>

      <!-- Email & Nomor Telepon -->
      <div class="form-row">
        <div class="form-group">
          <label for="email">Email *</label>
          <input type="email" id="email" placeholder="nama@email.com" required>
        </div>
        <div class="form-group">
          <label for="phone">Nomor Telepon / WA *</label>
          <input type="tel" id="phone" placeholder="081234567890" required>
        </div>
      </div>

      <!-- Posisi & Pendidikan -->
      <div class="form-row">
        <div class="form-group">
          <label for="position">Posisi yang Dilamar *</label>
          <input type="text" id="position" placeholder="Pilih atau ketik posisi" required>
        </div>
        <div class="form-group">
          <label for="education">Pendidikan Terakhir *</label>
          <select id="education" required>
            <option value="" disabled selected>Pilih tingkat...</option>
            <option value="SMA/SMK">SMA / SMK</option>
            <option value="D3">D3</option>
            <option value="S1/D4">S1 / D4</option>
            <option value="S2">S2</option>
          </select>
        </div>
      </div>

      <!-- Link Portfolio & Upload CV -->
      <div class="form-row">
        <div class="form-group">
          <label for="portfolio">Link Portfolio / LinkedIn</label>
          <input type="url" id="portfolio" placeholder="https://linkedin.com/in/username">
        </div>
        <div class="form-group">
          <label for="cv">Upload CV (PDF) *</label>
          <input type="file" id="cv" accept=".pdf" required>
        </div>
      </div>

      <!-- Pesan Lamaran -->
      <div class="form-group">
        <label for="message">Pesan Lamaran</label>
        <textarea id="message" placeholder="Ceritakan secara singkat tentang dirimu..."></textarea>
      </div>

      <!-- Tombol Submit -->
      <button type="submit" class="btn-submit">Kirim Lamaran</button>
    </form>

    <!-- Tempat Hasil Notifikasi JS -->
    <div id="result" class="result-message"></div>
  </section>

  <script src="script.js"></script>
</body>
</html>
